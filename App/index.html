<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // Add a new entry here each day: [folder, markdown file]
  const days = [
    ["08_UrbanRural", "08UrbanRuralMethodology.md"],
    ["06_Vintage",  "06VintageMethodology.md"],
    ["05_Sight",    "05SightMethodology.md"],
    ["04_Clusters", "04ClustersMethodology.md"],
    ["03_Polygons", "03PolygonsMethodology.md"],
    ["02_Lines",    "02LinesMethodology.md"],
  ];

  const root = "../30DayMapChallenge/";
  const out = document.getElementById("days");

  Promise.all(days.map(async ([dir, file]) => {
    const md = await (await fetch(`${root}${dir}/${file}`)).text();
    const base = `${root}${dir}/`;
    const section = document.createElement("section");
    section.innerHTML = marked.parse(md).replace("#30DayMapChallenge ", "");
    // Point relative image paths at the day's folder
    section.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src");
      if (!/^(https?:|\/)/.test(src)) img.src = base + src;
    });
    return section.outerHTML;
  })).then(html => out.innerHTML = html.join(""))
    .catch(e => out.textContent = "Could not load entries (serve the repo root over HTTP): " + e);
</script>
